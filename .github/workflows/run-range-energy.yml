    - name: Display Final Energy Results
      id: ecoci
      uses: green-coding-solutions/eco-ci-energy-estimation@v5
      with:
        task: display-results
        send-data: false
        display-table: true
        json-output: true # <--- ΕΔΩ: Ενεργοποιούμε το JSON output

    - name: Calculate, Compare and Generate Summary
      shell: python
      env:
        # ΕΔΩ: Διαβάζουμε το σωστό output 'data-total-json'
        ECO_DATA: ${{ steps.ecoci.outputs.data-total-json }}
      run: |
        import json
        import os
        import sys

        try:
            raw_data = os.environ.get('ECO_DATA', '{}')
            data = json.loads(raw_data)
            
            measurements = data.get('measurements', [])
            
            for measurement in measurements:
                energy_j = measurement.get('energy_j', 0.0)
                duration_ms = measurement.get('duration_ms', 0.0)
                duration_s = duration_ms / 1000.0
                
                measurement['edp_js'] = energy_j * duration_s
                measurement['ed2p_js2'] = energy_j * (duration_s ** 2)
                measurement['duration_s'] = duration_s

            with open('energy_metrics.json', 'w') as f:
                json.dump(data, f, indent=2)

            summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
            if summary_path:
                with open(summary_path, 'a', encoding='utf-8') as sf:
                    sf.write("# 📊 Energy & Performance Analysis Report\n\n")
                    sf.write("Ανάλυση αποδοτικότητας και trade-offs ανάμεσα στις εκτελέσεις.\n\n")
                    
                    sf.write("### 📈 Συγκεντρωτικός Πίνακας Μέτρησης\n")
                    sf.write("| Label | Ενέργεια (J) | Χρόνος (s) | EDP (J·s) | ED²P (J·s²) |\n")
                    sf.write("| :--- | :---: | :---: | :---: | :---: |\n")
                    
                    for m in measurements:
                        sf.write(f"| {m['label']} | {m['energy_j']:.4f} | {m['duration_s']:.4f} | {m['edp_js']:.6f} | {m['ed2p_js2']:.8f} |\n")
                    
                    sf.write("\n")

                    if len(measurements) >= 2:
                        sf.write("### 🏆 Ανάλυση & Βέλτιστες Επιλογές\n")
                        
                        best_time = min(measurements, key=lambda x: x['duration_s'])
                        best_energy = min(measurements, key=lambda x: x['energy_j'])
                        best_edp = min(measurements, key=lambda x: x['edp_js'])
                        best_ed2p = min(measurements, key=lambda x: x['ed2p_js2'])
                        
                        sf.write(f"* **🚀 Ταχύτερη Εκτέλεση (Delay):** `{best_time['label']}` ({best_time['duration_s']:.4f} s)\n")
                        sf.write(f"* **🌱 Πράσινη Εκτέλεση (Energy):** `{best_energy['label']}` ({best_energy['energy_j']:.4f} J)\n")
                        sf.write(f"* **⚖️ Καλύτερο Trade-off (EDP):** `{best_edp['label']}` ({best_edp['edp_js']:.6f} J·s) — *Ισορροπία ενέργειας και απόδοσης.*\n")
                        sf.write(f"* **🏎️ Έμφαση στην Ταχύτητα (ED²P):** `{best_ed2p['label']}` ({best_ed2p['ed2p_js2']:.8f} J·s²) — *Αυστηρή ποινή στην καθυστέρηση.*\n")
            
            print("Successfully updated metrics and generated GitHub summary.")
            
        except Exception as e:
            print(f"Error executing analysis script: {e}")
            sys.exit(1)
